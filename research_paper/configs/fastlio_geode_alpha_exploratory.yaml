# GEODE Urban_Tunnel01 development replay, FAST-LIO 7cc4175d.
# Provisional interpretation: published T_IMU_LiDAR maps LiDAR coordinates
# into IMU coordinates. GEODE does not explicitly define that direction.
# Retain this caveat in every manifest and do not claim calibrated accuracy.
common:
  lid_topic: /velodyne_points
  imu_topic: /imu/data
  time_sync_en: false
  time_offset_lidar_to_imu: 0.0
preprocess:
  lidar_type: 2
  scan_line: 16
  scan_rate: 10
  timestamp_unit: 0
  blind: 2.0
mapping:
  acc_cov: 0.1
  gyr_cov: 0.1
  b_acc_cov: 0.0001
  b_gyr_cov: 0.0001
  fov_degree: 180.0
  det_range: 100.0
  extrinsic_est_en: false
  extrinsic_T: [0.010965, -0.086864, 0.060426]
  extrinsic_R: [0.9989892, 0.0444870, -0.0064406,
                -0.0446353, 0.9986885, -0.0250789,
                0.0053164, 0.0253410, 0.9996647]
publish:
  path_en: false
  scan_publish_en: false
  dense_publish_en: false
  scan_bodyframe_pub_en: false
pcd_save:
  pcd_save_en: false
  interval: -1
feature_extract_enable: false
point_filter_num: 4
max_iteration: 3
filter_size_surf: 0.5
filter_size_map: 0.5
cube_side_length: 1000.0
runtime_pos_log_enable: false
