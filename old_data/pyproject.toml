[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gps-denied-landing"
version = "0.1.0"
description = "Hardware-constrained simulation baseline for GPS-denied drone landing-zone detection"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<3"]

[project.optional-dependencies]
plot = ["matplotlib>=3.7"]
dev = ["pytest>=8"]

[project.scripts]
gps-landing = "gps_denied_landing.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

